name: collect

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect on the queue branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin queue || true
          if git show-ref --verify --quiet refs/remotes/origin/queue; then
            git checkout -B queue origin/queue
          else
            git checkout -B queue
          fi
          python3 scripts/collect.py
          git add queue/pending.json queue/state.json queue/history.json
          if git diff --cached --quiet; then
            echo "No new metadata"
            exit 0
          fi
          git commit -m "chore: collect headlines"
          git push origin queue
