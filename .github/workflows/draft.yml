name: draft

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Draft from the queue branch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          DRAFT_LIMIT: "1"
        run: |
          set +e
          python3 scripts/draft.py > draft.log 2>&1
          code=$?
          cat draft.log
          {
            echo '```'
            tail -n 60 draft.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- content/stories)" ]; then
            echo "No new drafts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="draft/$(date -u +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git add content/stories
          git commit -m "feat: draft explanations"
          git push origin "$branch"
          if gh pr create --base main --head "$branch" --title "feat: draft explanations" --body "Draft explanations from the queue branch. Each story stays draft until a reviewer checks the original report and changes status to published."; then
            exit 0
          fi
          echo "::error::GitHub Actions could not open the pull request. In Settings, Actions, General, Workflow permissions, choose read and write and allow GitHub Actions to create pull requests."
          echo "The draft branch is $branch"
          echo "https://github.com/${{ github.repository }}/compare/main...${branch}?expand=1"
          exit 1
